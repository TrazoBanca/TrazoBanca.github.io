<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TrazoBanca</title>
<style>
  /* Reset */
  *, *::before, *::after {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: rgba(0,0,0,0.3);
    padding: 1rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(6px);
  }
  header h1 {
    margin: 0;
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: 1px;
  }
  nav a {
    color: #fff;
    text-decoration: none;
    margin-left: 1.5rem;
    font-weight: 600;
    transition: color 0.3s ease;
  }
  nav a:hover, nav a:focus {
    color: #ffdd57;
  }
  main {
    flex: 1;
    padding: 3rem 2rem;
    max-width: 900px;
    margin: 0 auto;
  }
  main h2 {
    font-size: 2.8rem;
    margin-bottom: 1rem;
    text-align: center;
    text-shadow: 2px 2px 5px rgba(0,0,0,0.4);
  }
  main p {
    font-size: 1.25rem;
    line-height: 1.6;
    max-width: 600px;
    margin: 0 auto 3rem;
    text-align: center;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
  }
  .features {
    display: flex;
    flex-wrap: wrap;
    gap: 2rem;
    justify-content: center;
  }
  .feature-card {
    background: rgba(255,255,255,0.15);
    border-radius: 15px;
    box-shadow: 0 8px 15px rgba(0,0,0,0.15);
    flex: 1 1 220px;
    max-width: 280px;
    padding: 2rem 1.5rem;
    text-align: center;
    transition: background 0.3s ease, transform 0.3s ease;
  }
  .feature-card:hover, .feature-card:focus-within {
    background: rgba(255,255,255,0.30);
    transform: translateY(-8px);
  }
  .feature-icon {
    font-size: 3rem;
    margin-bottom: 1rem;
    color: #ffdd57;
  }
  .feature-title {
    font-size: 1.5rem;
    margin-bottom: 0.75rem;
    font-weight: 700;
  }
  .feature-desc {
    font-size: 1rem;
    line-height: 1.4;
  }
  footer {
    text-align: center;
    padding: 1.5rem 2rem;
    background: rgba(0,0,0,0.3);
    font-size: 0.9rem;
    user-select: none;
  }
  #edit {
    background: rgba(255,255,255,0.12);
    border-radius: 15px;
    padding: 2rem 1.5rem;
    max-width: 500px;
    margin: 3rem auto;
    box-shadow: 0 8px 15px rgba(0,0,0,0.25);
    text-align: center;
  }
  #edit h2 {
    margin-bottom: 1.5rem;
  }
  #edit input {
    padding: 0.5rem 1rem;
    border-radius: 8px;
    border: none;
    margin: 0.5rem 1rem 1rem 0;
    font-size: 1rem;
    width: 180px;
    max-width: 100%;
    color: #333;
  }
  #update-button {
    background: #ffdd57;
    color: #333;
    border: none;
    padding: 0.75rem 1.5rem;
    font-size: 1rem;
    font-weight: 700;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.3s ease;
  }
  #update-button:hover, #update-button:focus {
    background: #e6c847;
  }
  #login-form {
    margin-top: 1.5rem;
    text-align: left;
    color: #333;
    background: #fff;
    padding: 1rem 1.5rem;
    border-radius: 12px;
  }
  #login-form input {
    width: 100%;
    margin: 0.5rem 0 1rem 0;
  }
  #login-form button {
    width: 100%;
    background: #667eea;
    color: white;
    font-weight: 700;
    font-size: 1rem;
    border-radius: 8px;
    padding: 0.5rem;
    border: none;
    cursor: pointer;
  }
  #login-form button:hover {
    background: #4b60d9;
  }
  #login-message {
    margin-top: 0.75rem;
    font-weight: 600;
  }
  #logout-button {
    margin-top: 1rem;
    cursor: pointer;
    background: #ff4747;
    border: none;
    padding: 0.5rem 1rem;
    color: white;
    font-weight: 700;
    border-radius: 8px;
  }
  #logout-button:hover {
    background: #d63c3c;
  }
  @media (max-width: 600px) {
    main h2 {
      font-size: 2rem;
    }
    .features {
      flex-direction: column;
      gap: 1.5rem;
    }
    header {
      flex-direction: column;
      align-items: flex-start;
    }
    nav {
      margin-top: 0.75rem;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 1.5rem;
    }
    #edit input {
      width: 100%;
      margin-bottom: 1rem;
    }
  }
</style>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

</head>
<body>
<header>
  <h1>TrazoBanca</h1>
  <nav role="navigation" aria-label="Primary">
    <a href="#welcome" tabindex="0">Welcome</a>
    <a href="#features" tabindex="0">Features</a>
    <a href="#contact" tabindex="0">Contact</a>
    <a href="#edit" tabindex="0">Edit</a>
  </nav>
</header>
<main>
  <section id="welcome" tabindex="0">
    <h2>Bienvenido/a a Trazo Banca</h2>
    <p>Registro de cuentas de Trazo Banca</p>
  </section>
  <section id="features" class="features" tabindex="0" aria-label="Website Features">
    <article class="feature-card" tabindex="0" role="article" aria-labelledby="feature1-title">
      <div class="feature-icon" aria-hidden="true">💲</div>
      <h3 id="feature1-title" class="feature-title">Bruno</h3>
      <p id="feature1-balance" class="feature-desc">251P</p>
    </article>
    <article class="feature-card" tabindex="0" role="article" aria-labelledby="feature2-title">
      <div class="feature-icon" aria-hidden="true">💲</div>
      <h3 id="feature2-title" class="feature-title">Manuel</h3>
      <p id="feature2-balance" class="feature-desc">102P</p>
    </article>
  </section>
  <section id="contact" tabindex="0" aria-label="Contact Us">
    <h2>Contactanos</h2>
    <p>si tienes alguna duda contactanos en <a href="mailto:manutrazo58@gmail.com" style="color: #ffdd57;">manutrazo58@gmail.com</a>.</p>
  </section>
  <section id="edit" tabindex="0" aria-label="Edit User Balances">
    <h2>Editar Saldos de Usuarios</h2>
    <input type="text" id="bruno-balance-input" placeholder="Saldo de Bruno" aria-label="Saldo de Bruno" />
    <input type="text" id="manuel-balance-input" placeholder="Saldo de Manuel" aria-label="Saldo de Manuel" />
    <br />
    <button id="update-button" disabled>Actualizar Saldos</button>
    <p id="update-message" style="margin-top: 1rem;"></p>

    <div id="login-container">
      <form id="login-form" aria-label="Login Form">
        <label for="email-input" style="color:#333; font-weight:600;">Email:</label>
        <input type="email" id="email-input" required placeholder="Tu correo electrónico" />
        <label for="password-input" style="color:#333; font-weight:600;">Contraseña:</label>
        <input type="password" id="password-input" required placeholder="Tu contraseña" />
        <button type="submit">Iniciar sesión</button>
        <p id="login-message"></p>
      </form>
      <button id="logout-button" style="display:none;">Cerrar sesión</button>
    </div>
  </section>
</main>
<footer>
  &copy; 2024 TrazoBanca. All rights reserved.
</footer>

<script>
  // Firebase config - replace with your own
  var firebaseConfig = {
    apiKey: "AIzaSyDf7KWfPZ4krDDpoG2vk3V_qj_Qf7CznKQ",
    authDomain: "banca-458b0.firebaseapp.com",
    databaseURL: "https://banca-458b0-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "banca-458b0",
    storageBucket: "banca-458b0.firebasestorage.app",
    messagingSenderId: "1012969232014",
    appId: "1:1012969232014:web:378b6f8ea61a4692419bdf"
  };
  // Initialize Firebase
  firebase.initializeApp(firebaseConfig);
  var database = firebase.database();
  var auth = firebase.auth();

  // Replace this with your authorized Firebase user UID
  var authorizedUID = "YOUR_AUTHORIZED_USER_UID";

  // References to DOM elements
  var brunoInput = document.getElementById('bruno-balance-input');
  var manuelInput = document.getElementById('manuel-balance-input');
  var updateButton = document.getElementById('update-button');
  var updateMessage = document.getElementById('update-message');

  var loginForm = document.getElementById('login-form');
  var emailInput = document.getElementById('email-input');
  var passwordInput = document.getElementById('password-input');
  var loginMessage = document.getElementById('login-message');
  var logoutButton = document.getElementById('logout-button');

  // Update the UI with balances from database
  function updateUI(usersData) {
    if (usersData) {
      if (usersData.user1) {
        document.getElementById('feature1-title').innerText = usersData.user1.name || "Bruno";
        document.getElementById('feature1-balance').innerText = usersData.user1.balance || "251P";
        brunoInput.value = usersData.user1.balance || "";
      }
      if (usersData.user2) {
        document.getElementById('feature2-title').innerText = usersData.user2.name || "Manuel";
        document.getElementById('feature2-balance').innerText = usersData.user2.balance || "102P";
        manuelInput.value = usersData.user2.balance || "";
      }
    }
  }
  // Listen for realtime updates
  database.ref('users').on('value', function(snapshot) {
    updateUI(snapshot.val());
  });

  // Enable or disable editing controls based on auth and authorization
  function updateControls(user) {
    if (user && user.uid === authorizedUID) {
      brunoInput.disabled = false;
      manuelInput.disabled = false;
      updateButton.disabled = false;
      loginForm.style.display = 'none';
      logoutButton.style.display = 'inline-block';
      loginMessage.textContent = '';
      updateMessage.textContent = '';
    } else {
      brunoInput.disabled = true;
      manuelInput.disabled = true;
      updateButton.disabled = true;
      loginForm.style.display = 'block';
      logoutButton.style.display = 'none';
      if (!user) {
        loginMessage.textContent = 'Debes iniciar sesión para editar saldos.';
      } else {
        loginMessage.textContent = 'Usuario no autorizado para editar saldos.';
      }
      updateMessage.textContent = '';
    }
  }

  // Handle authentication state changes
  auth.onAuthStateChanged(function(user) {
    updateControls(user);
  });

  // Handle form login submission
  loginForm.addEventListener('submit', function(e) {
    e.preventDefault();
    loginMessage.textContent = 'Iniciando sesión...';
    var email = emailInput.value.trim();
    var password = passwordInput.value.trim();
    auth.signInWithEmailAndPassword(email, password)
      .then(() => {
        loginMessage.textContent = 'Sesión iniciada correctamente.';
        loginForm.reset();
      })
      .catch(function(error) {
        loginMessage.style.color = 'red';
        loginMessage.textContent = 'Error al iniciar sesión: ' + error.message;
      });
  });

  // Handle logout
  logoutButton.addEventListener('click', function() {
    auth.signOut();
    loginMessage.style.color = '#333';
    loginMessage.textContent = 'Sesión cerrada.';
  });

  // Update button event listener
  updateButton.addEventListener('click', function() {
    var user = auth.currentUser;
    if (!user) {
      updateMessage.style.color = 'red';
      updateMessage.textContent = 'Debes iniciar sesión para actualizar.';
      return;
    }
    if (user.uid !== authorizedUID) {
      updateMessage.style.color = 'red';
      updateMessage.textContent = 'No estás autorizado para actualizar los saldos.';
      return;
    }
    var brunoBalance = brunoInput.value.trim();
    var manuelBalance = manuelInput.value.trim();
    var updates = {};
    if (brunoBalance) {
      updates['users/user1/balance'] = brunoBalance;
    }
    if (manuelBalance) {
      updates['users/user2/balance'] = manuelBalance;
    }
    updateMessage.style.color = '#ffdd57';
    updateMessage.textContent = 'Actualizando saldos...';
    database.ref().update(updates, function(error) {
      if (error) {
        updateMessage.style.color = 'red';
        updateMessage.textContent = 'Error actualizando los saldos. Inténtalo de nuevo.';
      } else {
        updateMessage.style.color = 'lightgreen';
        updateMessage.textContent = 'Saldos actualizados correctamente.';
      }
      setTimeout(() => {
        updateMessage.textContent = '';
      }, 4000);
    });
  });
</script>
</body>
</html>
