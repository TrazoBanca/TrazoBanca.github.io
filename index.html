<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TrazoBanca</title>
<style>
  /* Reset */
  *, *::before, *::after {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: rgba(0,0,0,0.3);
    padding: 1rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(6px);
  }
  header h1 {
    margin: 0;
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: 1px;
  }
  nav a {
    color: #fff;
    text-decoration: none;
    margin-left: 1.5rem;
    font-weight: 600;
    transition: color 0.3s ease;
  }
  nav a:hover, nav a:focus {
    color: #ffdd57;
  }
  main {
    flex: 1;
    padding: 3rem 2rem;
    max-width: 900px;
    margin: 0 auto;
  }
  main h2 {
    font-size: 2.8rem;
    margin-bottom: 1rem;
    text-align: center;
    text-shadow: 2px 2px 5px rgba(0,0,0,0.4);
  }
  main p {
    font-size: 1.25rem;
    line-height: 1.6;
    max-width: 600px;
    margin: 0 auto 3rem;
    text-align: center;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
  }
  .features {
    display: flex;
    flex-wrap: wrap;
    gap: 2rem;
    justify-content: center;
  }
  .feature-card {
    background: rgba(255,255,255,0.15);
    border-radius: 15px;
    box-shadow: 0 8px 15px rgba(0,0,0,0.15);
    flex: 1 1 220px;
    max-width: 280px;
    padding: 2rem 1.5rem;
    text-align: center;
    transition: background 0.3s ease, transform 0.3s ease;
  }
  .feature-card:hover, .feature-card:focus-within {
    background: rgba(255,255,255,0.30);
    transform: translateY(-8px);
  }
  .feature-icon {
    font-size: 3rem;
    margin-bottom: 1rem;
    color: #ffdd57;
  }
  .feature-title {
    font-size: 1.5rem;
    margin-bottom: 0.75rem;
    font-weight: 700;
  }
  .feature-desc {
    font-size: 1rem;
    line-height: 1.4;
  }
  footer {
    text-align: center;
    padding: 1.5rem 2rem;
    background: rgba(0,0,0,0.3);
    font-size: 0.9rem;
    user-select: none;
  }
  @media (max-width: 600px) {
    main h2 {
      font-size: 2rem;
    }
    .features {
      flex-direction: column;
      gap: 1.5rem;
    }
    header {
      flex-direction: column;
      align-items: flex-start;
    }
    nav {
      margin-top: 0.75rem;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 1.5rem;
    }
  }
</style>
</head>
<body>
<header>
  <h1>TrazoBanca</h1>
  <nav role="navigation" aria-label="Primary">
    <a href="#welcome" tabindex="0">Welcome</a>
    <a href="#features" tabindex="0">Features</a>
    <a href="#contact" tabindex="0">Contact</a>
  </nav>
</header>
<main>
  <section id="welcome" tabindex="0">
    <h2>Bienvenido/a a Trazo Banca</h2>
    <p>Registro de cuentas de Trazo Banca</p>
  </section>
  <section id="features" class="features" tabindex="0" aria-label="Website Features">
    <article class="feature-card" tabindex="0" role="article" aria-labelledby="feature1-title">
      <div class="feature-icon" aria-hidden="true">💲</div>
      <h3 id="feature1-title" class="feature-title">Bruno</h3>
      <p class="feature-desc">147P</p>
    </article>
    <article class="feature-card" tabindex="0" role="article" aria-labelledby="feature2-title">
      <div class="feature-icon" aria-hidden="true">💲</div>
      <h3 id="feature2-title" class="feature-title">Manuel</h3>
      <p class="feature-desc">30P + 90P</p>
    </article>
  </section>
  <section id="contact" tabindex="0" aria-label="Contact Us">
    <h2>Contactanos</h2>
    <p>si tienes alguna duda contactanos en <a href="mailto:manutrazo58@gmail.com" style="color: #ffdd57;">manutrazo58@gmail.com</a>.</p>
  </section>
</main>
<footer>
  &copy; 2024 TrazoBanca. All rights reserved.
</footer>
</body>
</html>
